spring.application.name=document-management-api
server.port=${SERVER_PORT:8080}

# Database connection. The defaults allow a zero-config local run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/docmanagement?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway owns the schema; Hibernate only verifies that entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

# Multipart uploads
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
